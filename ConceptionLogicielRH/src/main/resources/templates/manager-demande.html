
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle demande - ConceptionLogicielRH</title>
</head>
<body style="margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#243247">

<div style="display:flex;min-height:100vh">

    <aside style="width:240px;background:#172b4d;color:white;padding:25px">
        <h2>ConceptionLogicielRH</h2>
        <p>Espace Manager</p>
        <hr>
        <p><a href="/manager/dashboard" style="color:white">▦ Tableau de bord</a></p>
        <p><a href="/manager/dashboard?vue=nouvelle-demande" style="color:white">＋ Nouvelle demande</a></p>
        <p><a href="/manager/dashboard?vue=mes-demandes" style="color:white">▤ Mes demandes</a></p>
    </aside>

    <main style="flex:1;padding:35px;max-width:900px">
        <p>Espace Manager / Nouvelle demande</p>
        <h1>Nouvelle demande de personnel</h1>
        <p>Renseignez les informations nécessaires à votre demande.</p>

        <form action="#" method="post"
              style="background:white;padding:25px;border-radius:12px">

            <label for="poste">Poste demandé</label><br>
            <input id="poste" name="poste" required
                   style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">

            <label for="departement">Département</label><br>
            <input id="departement" name="departement" required
                   style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">

            <label for="effectif">Effectif demandé</label><br>
            <input id="effectif" name="effectif" type="number" min="1" required
                   style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">

            <label for="motif">Motif de la demande</label><br>
            <textarea id="motif" name="motif" rows="4" required
                      style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box"></textarea>

            <label for="budget">Budget estimé</label><br>
            <input id="budget" name="budget" type="number" min="0" step="0.01" required
                   style="width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">

            <label for="dateSouhaitee">Date souhaitée</label><br>
            <input id="dateSouhaitee" name="dateSouhaitee" type="date" required
                   style="width:100%;padding:12px;margin:8px 0 25px;box-sizing:border-box">

            <button type="submit"
                    style="background:#2457c5;color:white;border:0;padding:13px 22px;border-radius:7px;cursor:pointer">
                Enregistrer la demande
            </button>

            <a href="/manager/dashboard"
               style="margin-left:15px;color:#2457c5">Annuler</a>
        </form>
    </main>
</div>
</body>
</html>
