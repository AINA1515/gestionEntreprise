spring.application.name=gestionRH

# ============================================================
# DataSource Oracle 11g (tables créées par database/gestion_rh.sql)
# Modifie URL / username / password selon ton installation.
# Exemple : schema RH_APP en local sur Oracle XE
# ============================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/EE.oracle.docker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Les tables existent déjà via le script SQL (triggers + séquences) :
# on ne laisse JAMAIS Hibernate créer/modifier le schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# Pool Hikari (valeurs sûres pour Oracle + triggers qui lisent DBMS_SESSION)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2



# Authentification JWT. APP_JWT_SECRET doit contenir au moins 32 octets aléatoires.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:30}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Création optionnelle d'un compte initial, seulement si aucun rôle ADMIN n'est attribué.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
