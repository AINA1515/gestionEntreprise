spring.application.name=gestionRH

# ============================================================
# DataSource Oracle 11g (tables créées par database/gestion_rh.sql)
# Modifie URL / username / password selon ton installation.
# Exemple : schema RH_APP en local sur Oracle XE
# ============================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/EE.oracle.docker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Les tables existent déjà via le script SQL (triggers + séquences) :
# on ne laisse JAMAIS Hibernate créer/modifier le schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# Pool Hikari (valeurs sûres pour Oracle + triggers qui lisent DBMS_SESSION)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2



# Authentification JWT. APP_JWT_SECRET doit contenir au moins 32 octets aléatoires.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:30}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Création optionnelle d'un compte initial, seulement si aucun rôle ADMIN n'est attribué.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
# GED : répertoire privé hors ressources web. Le stockage est configuré par environnement.
app.ged.root=${APP_GED_ROOT:./storage/ged}
app.ged.max-size-bytes=${APP_GED_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=${APP_GED_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_GED_MAX_FILE_SIZE:5MB}

# Notifications : l'outbox reste active; SMTP est désactivé par défaut (les envois sont consignés en profil local).
app.notifications.scheduler.enabled=${NOTIFICATIONS_SCHEDULER_ENABLED:true}
app.notifications.scheduler.delay-ms=${NOTIFICATIONS_SCHEDULER_DELAY_MS:15000}
app.notifications.reminders.cron=${NOTIFICATIONS_REMINDERS_CRON:0 0 8 * * *}
app.notifications.mail.enabled=${NOTIFICATIONS_MAIL_ENABLED:false}
app.notifications.mail.from=${NOTIFICATIONS_MAIL_FROM:no-reply@gestionrh.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
